name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  COVERAGE_FLOOR: "100.0"

jobs:
  native:
    name: native (${{ matrix.arch }}-${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            arch: amd64
            runner: ubuntu-latest
          - goos: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            arch: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (with coverage gate)
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -count=1 -covermode=atomic -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}% (floor ${COVERAGE_FLOOR}%)"
          awk -v c="$total" -v m="$COVERAGE_FLOOR" 'BEGIN { exit (c+0 >= m+0) ? 0 : 1 }' \
            || { echo "Coverage ${total}% below floor ${COVERAGE_FLOOR}%"; exit 1; }

  # Windows runs the FALLBACK, and nothing else does.
  #
  # clone_other.go is the `!darwin && !linux` implementation: it reports the
  # clone unsupported so Clone degrades to a byte copy. Until now the only
  # windows lane was `crossbuild`, which compiles that file and never runs it,
  # so the degraded path this library promises "everywhere else" was executed
  # on no platform that actually takes it.
  #
  # Its own job rather than another entry in `native`, because that matrix's
  # steps use POSIX prefixes (`CGO_ENABLED=0 go build`) and `set -euo
  # pipefail`, and the Windows runner is PowerShell, which reads the prefix as
  # a command it cannot find. CGO_ENABLED moves to env and the gate step asks
  # for bash by name.
  windows:
    name: windows (amd64, byte-copy fallback)
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (with coverage gate)
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -covermode=atomic -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}% (floor ${COVERAGE_FLOOR}%)"
          awk -v c="$total" -v m="$COVERAGE_FLOOR" 'BEGIN { exit (c+0 >= m+0) ? 0 : 1 }' \
            || { echo "Coverage ${total}% below floor ${COVERAGE_FLOOR}%"; exit 1; }


  emulated:
    name: emulated (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu_cpu: "rv64,v=true,vlen=128"
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu_cpu: "la464"
          - arch: ppc64le
            image: debian:trixie
            qemu_cpu: "power9"
          - arch: s390x
            image: debian:trixie
            qemu_cpu: "qemu"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Set up binfmt (QEMU)
        run: docker run --rm --privileged tonistiigi/binfmt --install all
      - name: Cross-compile per-package test binaries
        run: |
          set -euo pipefail
          mkdir -p testbins
          for pkg in $(go list ./...); do
            name=$(echo "$pkg" | tr '/' '_')
            # Skip packages that genuinely have no test files; everything else
            # MUST compile. A failed compile here is a real error and fails the
            # job — we do not swallow it (a swallowed build break once let a
            # whole arch silently skip its coverage gate).
            hastests=$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}yes{{end}}' "$pkg")
            if [ -z "$hastests" ]; then
              echo "no test files for $pkg, skipping"
              continue
            fi
            echo "Compiling test binary for $pkg"
            CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
              go test -c -covermode=atomic -o "testbins/${name}.test" "$pkg"
          done
          ls -l testbins
      - name: Run test binaries under QEMU (${{ matrix.arch }})
        run: |
          set -euo pipefail
          shopt -s nullglob
          for bin in testbins/*.test; do
            echo "::group::Running $bin on linux/${{ matrix.arch }}"
            docker run --rm --platform linux/${{ matrix.arch }} \
              -e QEMU_CPU='${{ matrix.qemu_cpu }}' \
              -v "$PWD":/work -w /work \
              ${{ matrix.image }} \
              "/work/$bin" -test.v -test.short
            echo "::endgroup::"
          done

  crossbuild:
    name: cross-build (${{ matrix.goos }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # darwin/amd64: the APFS clonefile path is run natively on the
          # arm64 macOS lane above; this cross-build keeps the amd64 darwin
          # binary green without a (perennially backlogged) Intel-mac runner.
          - goos: darwin
            arch: amd64
          # windows/freebsd: cloneCoW compiles to the plain-copy fallback stub
          # (clone_other.go); ensure it stays green everywhere it is built.
          - goos: windows
            arch: amd64
          - goos: freebsd
            arch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build + vet + test-compile (${{ matrix.goos }}/${{ matrix.arch }})
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.arch }} go build ./...
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.arch }} go vet ./...
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.arch }} go test -c -o /dev/null ./...
